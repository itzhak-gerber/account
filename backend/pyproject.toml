[project]
name = "invoice-backend"
version = "0.1.0"
description = "Invoice platform backend: REST API + MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "redis>=5",
    "arq>=0.28",
    "mcp>=2.3",
    "structlog>=26.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "aiosmtplib>=4",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.28",
    "ruff>=0.13",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
