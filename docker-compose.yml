# Local development stack: docker compose up --build
# App:       http://localhost:5173
# API docs:  http://localhost:8000/api/docs
# MCP:       http://localhost:8000/mcp/
# Keycloak:  http://localhost:8080 (admin / admin)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice}
      POSTGRES_DB: invoice
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports: ["8080:8080"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+asyncpg://invoice:${POSTGRES_PASSWORD:-invoice}@postgres:5432/invoice
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: ./backend
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres-data:
