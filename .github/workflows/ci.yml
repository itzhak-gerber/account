name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be deploying (a half-finished migration helps nobody).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/stoic-goldberg-6t002s' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoice" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      APP_ENVIRONMENT: test
      # Tests connect as the restricted app role so row-level security is exercised.
      APP_DATABASE_URL: postgresql+asyncpg://invoice_app:invoice_app@localhost:5432/invoice
      APP_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://invoice:invoice@localhost:5432/invoice
      # Azurite's well-known development account (public, emulator only).
      APP_TEST_AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: PDF rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - name: Create the app database role
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE invoice_app LOGIN PASSWORD 'invoice_app'"
        env:
          PGHOST: localhost
          PGUSER: invoice
          PGPASSWORD: invoice
          PGDATABASE: invoice
      - name: Migrate (as schema owner), then check downgrade and models are in sync
        env:
          APP_DATABASE_URL: postgresql+asyncpg://invoice:invoice@localhost:5432/invoice
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Start the Azure Storage emulator (Azurite)
        # Started here, not as a service container, to pass --skipApiVersionCheck: the Azure SDK
        # can be newer than the emulator image.
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Realm files are valid, and the production realm is up to date
        run: |
          python3 -m json.tool infra/keycloak/realm-invoice.dev.json > /dev/null
          python3 infra/keycloak/build_prod_realm.py --check
      - name: Azure definition compiles and passes the linter
        run: |
          az bicep install
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep lint --file infra/azure/main.bicep
      - name: Setup script
        run: shellcheck infra/azure/bootstrap.sh

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t invoice-backend backend
      - name: Hebrew PDF renders inside the image
        run: |
          docker run --rm --entrypoint python invoice-backend -c "
          from weasyprint import HTML
          pdf = HTML(string='<html dir=rtl><body>חשבונית מס</body></html>').write_pdf()
          assert pdf.startswith(b'%PDF'), 'no PDF'
          print('PDF OK', len(pdf))"
      - run: docker build --target prod -t invoice-frontend frontend
      - run: docker build -t invoice-keycloak infra/keycloak

  deploy:
    needs: [docker, infra]
    # Only from the deploying branches, only once Azure is set up (bootstrap.sh), and only while
    # the AUTO_DEPLOY variable is "true". Otherwise deploy by hand: Actions -> Deploy (Azure dev).
    if: >-
      github.event_name == 'push' && vars.AZURE_ENV != '' && vars.AUTO_DEPLOY == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/stoic-goldberg-6t002s')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
