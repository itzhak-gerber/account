name: Deploy (Azure dev)

# Called by CI after all tests pass, when the AUTO_DEPLOY variable is "true"; or run by hand
# (Actions -> Deploy (Azure dev) -> Run workflow) for the chosen branch's latest commit, which
# should be one whose CI run is green. A deploy also starts a paused environment.
# Signs in to Azure with OpenID Connect: no password or key is stored in GitHub.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dev
      url: ${{ steps.apps.outputs.app_url }}
    env:
      RG: ${{ fromJSON(vars.AZURE_ENV).resourceGroup }}
      VAULT: ${{ fromJSON(vars.AZURE_ENV).keyVault }}
      SMTP_APP_ID: ${{ fromJSON(vars.AZURE_ENV).smtpAppId }}
      SMTP_PRINCIPAL_ID: ${{ fromJSON(vars.AZURE_ENV).smtpPrincipalId }}
      TAG: ${{ github.sha }}
      # Optional AZURE_ENV fields to force a database size/zone; otherwise the deploy picks the
      # first with capacity (small sizes are often full in Sweden Central for new subscriptions).
      PG_SKU_OVERRIDE: ${{ fromJSON(vars.AZURE_ENV).postgresSku || '' }}
      PG_TIER_OVERRIDE: ${{ fromJSON(vars.AZURE_ENV).postgresTier || '' }}
      PG_ZONE_OVERRIDE: ${{ fromJSON(vars.AZURE_ENV).postgresZone || '' }}
      # Region for the network, database and apps (Sweden Central refused every database
      # size to this subscription). Optional AZURE_ENV field to change it.
      COMPUTE_LOCATION: ${{ fromJSON(vars.AZURE_ENV).computeLocation || 'northeurope' }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ fromJSON(vars.AZURE_ENV).clientId }}
          tenant-id: ${{ fromJSON(vars.AZURE_ENV).tenantId }}
          subscription-id: ${{ fromJSON(vars.AZURE_ENV).subscriptionId }}

      - name: Azure CLI extensions install without prompts
        run: az config set extension.use_dynamic_install=yes_without_prompt -o none

      - name: Database running (it may have been paused)
        run: |
          server=$(az postgres flexible-server list --resource-group "$RG" --query "[0].name" -o tsv)
          [ -n "$server" ] || exit 0
          state=$(az postgres flexible-server show --resource-group "$RG" --name "$server" \
            --query state -o tsv || true)
          echo "$server: ${state:-unknown}"
          case "$state" in
            Stopped)
              az postgres flexible-server start --resource-group "$RG" --name "$server" -o none ;;
            Ready|Starting|Updating|Stopping) ;;
            *)
              # A server whose creation failed (e.g. no capacity) blocks a retry. Remove it,
              # but only if the app's database was never created on it.
              if ! az postgres flexible-server db show --resource-group "$RG" \
                  --server-name "$server" --database-name invoice -o none 2>/dev/null; then
                echo "removing $server (creation failed, no data)"
                az postgres flexible-server delete --resource-group "$RG" --name "$server" \
                  --yes -o none
              fi ;;
          esac

      - name: Secrets exist in Key Vault (generated once, never printed)
        run: |
          for name in pg-admin-password app-db-password keycloak-db-password redis-password \
                      app-secret-key keycloak-admin-password web-client-secret; do
            if ! az keyvault secret show --vault-name "$VAULT" --name "$name" -o none 2>/dev/null; then
              az keyvault secret set --vault-name "$VAULT" --name "$name" \
                --value "$(openssl rand -hex 24)" -o none
              echo "created $name"
            fi
          done
          # Web Push (VAPID) signing key: an EC P-256 private key, base64url DER.
          if ! az keyvault secret show --vault-name "$VAULT" --name vapid-private-key -o none 2>/dev/null; then
            az keyvault secret set --vault-name "$VAULT" --name vapid-private-key -o none --value \
              "$(openssl ecparam -name prime256v1 -genkey -noout -outform DER | basenc --base64url -w0 | tr -d '=')"
            echo "created vapid-private-key"
          fi

      - name: Infrastructure (network, database, storage, registry, email)
        id: base
        run: |
          email_role=$(az role definition list --name "Communication and Email Service Owner" \
            --query "[0].name" -o tsv)
          echo "EMAIL_ROLE=$email_role" >> "$GITHUB_ENV"

          # Database size/zone: keep an existing server's; else the override; else try the
          # cheapest first and move on only when Azure has no capacity for it.
          existing=$(az postgres flexible-server list --resource-group "$RG" \
            --query "[?state=='Ready' || state=='Stopped' || state=='Starting' || state=='Stopping' || state=='Updating'] | [0].[sku.name, sku.tier, availabilityZone]" \
            -o tsv | tr '\t' ':')
          if [ -n "$existing" ]; then
            candidates=("$existing")
          elif [ -n "$PG_SKU_OVERRIDE" ]; then
            candidates=("$PG_SKU_OVERRIDE:${PG_TIER_OVERRIDE:-Burstable}:$PG_ZONE_OVERRIDE")
          else
            candidates=(Standard_B1ms:Burstable: Standard_B1ms:Burstable:1 Standard_B2s:Burstable:)
          fi

          for candidate in "${candidates[@]}"; do
            IFS=: read -r sku tier zone <<<"$candidate"
            # Azure may omit the tier (e.g. right after a paused server starts): derive it.
            if [ -z "$tier" ]; then
              case "$sku" in
                Standard_B*) tier=Burstable ;;
                Standard_E*) tier=MemoryOptimized ;;
                *) tier=GeneralPurpose ;;
              esac
            fi
            echo "database: $sku ($tier), zone ${zone:-any}"
            if az deployment group create --resource-group "$RG" --name "base-$GITHUB_RUN_ID" \
                --template-file infra/azure/main.bicep \
                --parameters stage=base keyVaultName="$VAULT" smtpAppId="$SMTP_APP_ID" \
                             smtpPrincipalId="$SMTP_PRINCIPAL_ID" emailRoleId="$email_role" \
                             postgresSku="$sku" postgresTier="$tier" postgresZone="$zone" \
                             computeLocation="$COMPUTE_LOCATION" \
                --query properties.outputs -o json > base.json 2> error.txt; then
              {
                echo "PG_SKU=$sku"
                echo "PG_TIER=$tier"
                echo "PG_ZONE=$zone"
              } >> "$GITHUB_ENV"
              echo "registry=$(jq -r .registryName.value base.json)" >> "$GITHUB_OUTPUT"
              echo "login_server=$(jq -r .registryLoginServer.value base.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat error.txt
            if ! grep -q RegionalAllocationFailed error.txt; then exit 1; fi
            echo "no capacity for $sku in zone ${zone:-any}, trying the next option"
          done
          echo "no database size/zone had capacity"; exit 1

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.base.outputs.registry }}
          LOGIN_SERVER: ${{ steps.base.outputs.login_server }}
        run: |
          az acr login --name "$REGISTRY"
          docker build -t "$LOGIN_SERVER/backend:$TAG" backend
          docker build --target prod -t "$LOGIN_SERVER/frontend:$TAG" frontend
          docker build -t "$LOGIN_SERVER/keycloak:$TAG" infra/keycloak
          for image in backend frontend keycloak; do docker push "$LOGIN_SERVER/$image:$TAG"; done
          if ! az acr repository show --name "$REGISTRY" --image redis:7-alpine -o none 2>/dev/null; then
            az acr import --name "$REGISTRY" --source docker.io/library/redis:7-alpine \
              --image redis:7-alpine
          fi

      - name: Database migrations (before the new version goes live)
        run: |
          az deployment group create --resource-group "$RG" --name "job-$GITHUB_RUN_ID" \
            --template-file infra/azure/main.bicep \
            --parameters stage=job imageTag="$TAG" keyVaultName="$VAULT" \
                         smtpAppId="$SMTP_APP_ID" smtpPrincipalId="$SMTP_PRINCIPAL_ID" \
                         emailRoleId="$EMAIL_ROLE" postgresSku="$PG_SKU" \
                         postgresTier="$PG_TIER" postgresZone="$PG_ZONE" \
                         computeLocation="$COMPUTE_LOCATION" -o none
          execution=$(az containerapp job start --name migrate --resource-group "$RG" \
            --query name -o tsv)
          echo "execution: $execution"
          for _ in $(seq 1 80); do
            status=$(az containerapp job execution show --name migrate --resource-group "$RG" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                az containerapp job logs show --name migrate --resource-group "$RG" \
                  --execution "$execution" --container migrate 2>/dev/null || true
                exit 1 ;;
            esac
            sleep 15
          done
          echo "migration did not finish in 20 minutes"; exit 1

      - name: Apps (web, backend, worker, Keycloak, Redis)
        id: apps
        run: |
          az deployment group create --resource-group "$RG" --name "apps-$GITHUB_RUN_ID" \
            --template-file infra/azure/main.bicep \
            --parameters stage=apps imageTag="$TAG" keyVaultName="$VAULT" \
                         smtpAppId="$SMTP_APP_ID" smtpPrincipalId="$SMTP_PRINCIPAL_ID" \
                         emailRoleId="$EMAIL_ROLE" postgresSku="$PG_SKU" \
                         postgresTier="$PG_TIER" postgresZone="$PG_ZONE" \
                         computeLocation="$COMPUTE_LOCATION" \
            --query properties.outputs -o json > apps.json
          echo "app_url=$(jq -r .appUrl.value apps.json)" >> "$GITHUB_OUTPUT"
          echo "auth_url=$(jq -r .authUrl.value apps.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.apps.outputs.app_url }}
          AUTH_URL: ${{ steps.apps.outputs.auth_url }}
        run: |
          check() {
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 10 "$1" > /dev/null; then echo "ok  $1"; return 0; fi
              sleep 10
            done
            echo "FAILED  $1"; return 1
          }
          check "$APP_URL/"
          check "$APP_URL/api/v1/health"
          check "$AUTH_URL/realms/invoice/.well-known/openid-configuration"
          {
            echo "### Deployed $TAG"
            echo "- App: $APP_URL"
            echo "- Login server: $AUTH_URL"
          } >> "$GITHUB_STEP_SUMMARY"
