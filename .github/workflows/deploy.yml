name: Deploy (Azure dev)

# Called by CI after all tests pass (and only once the AZURE_ENV variable exists).
# Signs in to Azure with OpenID Connect: no password or key is stored in GitHub.
on:
  workflow_call:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dev
      url: ${{ steps.apps.outputs.app_url }}
    env:
      RG: ${{ fromJSON(vars.AZURE_ENV).resourceGroup }}
      VAULT: ${{ fromJSON(vars.AZURE_ENV).keyVault }}
      SMTP_APP_ID: ${{ fromJSON(vars.AZURE_ENV).smtpAppId }}
      SMTP_PRINCIPAL_ID: ${{ fromJSON(vars.AZURE_ENV).smtpPrincipalId }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ fromJSON(vars.AZURE_ENV).clientId }}
          tenant-id: ${{ fromJSON(vars.AZURE_ENV).tenantId }}
          subscription-id: ${{ fromJSON(vars.AZURE_ENV).subscriptionId }}

      - name: Azure CLI extensions install without prompts
        run: az config set extension.use_dynamic_install=yes_without_prompt -o none

      - name: Secrets exist in Key Vault (generated once, never printed)
        run: |
          for name in pg-admin-password app-db-password keycloak-db-password redis-password \
                      app-secret-key keycloak-admin-password web-client-secret; do
            if ! az keyvault secret show --vault-name "$VAULT" --name "$name" -o none 2>/dev/null; then
              az keyvault secret set --vault-name "$VAULT" --name "$name" \
                --value "$(openssl rand -hex 24)" -o none
              echo "created $name"
            fi
          done

      - name: Infrastructure (network, database, storage, registry, email)
        id: base
        run: |
          email_role=$(az role definition list --name "Communication and Email Service Owner" \
            --query "[0].name" -o tsv)
          echo "EMAIL_ROLE=$email_role" >> "$GITHUB_ENV"
          az deployment group create --resource-group "$RG" --name "base-$GITHUB_RUN_ID" \
            --template-file infra/azure/main.bicep \
            --parameters stage=base keyVaultName="$VAULT" smtpAppId="$SMTP_APP_ID" \
                         smtpPrincipalId="$SMTP_PRINCIPAL_ID" emailRoleId="$email_role" \
            --query properties.outputs -o json > base.json
          echo "registry=$(jq -r .registryName.value base.json)" >> "$GITHUB_OUTPUT"
          echo "login_server=$(jq -r .registryLoginServer.value base.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.base.outputs.registry }}
          LOGIN_SERVER: ${{ steps.base.outputs.login_server }}
        run: |
          az acr login --name "$REGISTRY"
          docker build -t "$LOGIN_SERVER/backend:$TAG" backend
          docker build --target prod -t "$LOGIN_SERVER/frontend:$TAG" frontend
          docker build -t "$LOGIN_SERVER/keycloak:$TAG" infra/keycloak
          for image in backend frontend keycloak; do docker push "$LOGIN_SERVER/$image:$TAG"; done
          if ! az acr repository show --name "$REGISTRY" --image redis:7-alpine -o none 2>/dev/null; then
            az acr import --name "$REGISTRY" --source docker.io/library/redis:7-alpine \
              --image redis:7-alpine
          fi

      - name: Database migrations (before the new version goes live)
        run: |
          az deployment group create --resource-group "$RG" --name "job-$GITHUB_RUN_ID" \
            --template-file infra/azure/main.bicep \
            --parameters stage=job imageTag="$TAG" keyVaultName="$VAULT" \
                         smtpAppId="$SMTP_APP_ID" smtpPrincipalId="$SMTP_PRINCIPAL_ID" \
                         emailRoleId="$EMAIL_ROLE" -o none
          execution=$(az containerapp job start --name migrate --resource-group "$RG" \
            --query name -o tsv)
          echo "execution: $execution"
          for _ in $(seq 1 80); do
            status=$(az containerapp job execution show --name migrate --resource-group "$RG" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                az containerapp job logs show --name migrate --resource-group "$RG" \
                  --execution "$execution" --container migrate 2>/dev/null || true
                exit 1 ;;
            esac
            sleep 15
          done
          echo "migration did not finish in 20 minutes"; exit 1

      - name: Apps (web, backend, worker, Keycloak, Redis)
        id: apps
        run: |
          az deployment group create --resource-group "$RG" --name "apps-$GITHUB_RUN_ID" \
            --template-file infra/azure/main.bicep \
            --parameters stage=apps imageTag="$TAG" keyVaultName="$VAULT" \
                         smtpAppId="$SMTP_APP_ID" smtpPrincipalId="$SMTP_PRINCIPAL_ID" \
                         emailRoleId="$EMAIL_ROLE" \
            --query properties.outputs -o json > apps.json
          echo "app_url=$(jq -r .appUrl.value apps.json)" >> "$GITHUB_OUTPUT"
          echo "auth_url=$(jq -r .authUrl.value apps.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.apps.outputs.app_url }}
          AUTH_URL: ${{ steps.apps.outputs.auth_url }}
        run: |
          check() {
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 10 "$1" > /dev/null; then echo "ok  $1"; return 0; fi
              sleep 10
            done
            echo "FAILED  $1"; return 1
          }
          check "$APP_URL/"
          check "$APP_URL/api/v1/health"
          check "$AUTH_URL/realms/invoice/.well-known/openid-configuration"
          {
            echo "### Deployed $TAG"
            echo "- App: $APP_URL"
            echo "- Login server: $AUTH_URL"
          } >> "$GITHUB_STEP_SUMMARY"
