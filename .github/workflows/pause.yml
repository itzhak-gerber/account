name: Pause dev environment

# Run from GitHub: Actions -> "Pause dev environment" -> Run workflow.
# Scales every app to zero and stops the database, so almost nothing is billed while you
# are not working. Data is kept. Undo with "Resume dev environment" (or any deploy).
# Note: Azure starts a stopped database again by itself after 7 days.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      RG: ${{ fromJSON(vars.AZURE_ENV).resourceGroup }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ fromJSON(vars.AZURE_ENV).clientId }}
          tenant-id: ${{ fromJSON(vars.AZURE_ENV).tenantId }}
          subscription-id: ${{ fromJSON(vars.AZURE_ENV).subscriptionId }}

      - name: Apps scale to zero
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt -o none
          for app in invoice backend worker auth redis; do
            az containerapp update --name "$app" --resource-group "$RG" --min-replicas 0 -o none
            echo "$app: scaled to zero"
          done

      - name: Stop the database
        run: |
          server=$(az postgres flexible-server list --resource-group "$RG" --query "[0].name" -o tsv)
          state=$(az postgres flexible-server show --resource-group "$RG" --name "$server" \
            --query state -o tsv)
          if [ "$state" = "Ready" ]; then
            az postgres flexible-server stop --resource-group "$RG" --name "$server" -o none
            echo "$server: stopped"
          else
            echo "$server: $state (left as is)"
          fi
          {
            echo "### Dev environment paused"
            echo "Apps at zero, database stopped. Run **Resume dev environment** to continue."
          } >> "$GITHUB_STEP_SUMMARY"
